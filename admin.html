<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Travel data eSIM for 80+ destinations. Unlimited, daily and data-pack plans with instant QR code delivery by email.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1318" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23f2661c'/%3E%3Ctext x='32' y='42' font-size='26' font-weight='700' font-family='Arial,sans-serif' fill='%23fff' text-anchor='middle'%3E365%3C/text%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem("ts-theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch(e){}</script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}</style>
<title>365 Travel SIM · Admin</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 365 Travel SIM — Layout: landing page (hero search, destination cards, features, FAQ) + two-column plan page (plan picker left, info + device check right), fixed buy bar at the bottom; overlays for picker, cart, device check, admin detail */
:root{
  --c-daily:#e8590c; --s-daily:#fff1e7; --c-unl:#7c3aed; --s-unl:#f3edff; --c-tot:#0d9488; --s-tot:#e3f7f4;
  --bg:#ffffff; --panel:#f3f5f8; --surface:#ffffff; --ink:#191f28; --muted:#6b7684; --line:#e3e7ec;
  --accent:#1f5bd8; --accent-soft:#e8effd; --dark:#1b2333; --dark-ink:#ffffff; --hero:#f2f6ff; --hero-2:#dbe6ff;
  --orange:#e8590c; --orange-soft:#fff0e6; --teal:#0b8f83; --teal-soft:#e0f4f1; --sun:#c98a00; --sun-soft:#fff5d6;
  --ok:#12805c; --ok-soft:#e5f5ee; --warn:#a96400; --warn-soft:#fdf3e1; --bad:#d92d20; --bad-soft:#fdecea;
  --banner-a:#1f5bd8; --banner-b:#12a39c; --shadow:0 8px 30px rgba(20,30,45,.12);
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1318; --panel:#171c23; --surface:#1b2129; --ink:#e8ecf1; --muted:#98a2b0; --line:#2a323c;
  --c-daily:#ff8a4c; --s-daily:#2f1c10; --c-unl:#a78bfa; --s-unl:#231a3d; --c-tot:#2dd4bf; --s-tot:#0f2a27; --accent:#6f9dff; --accent-soft:#162447; --dark:#e8ecf1; --dark-ink:#11161c; --hero:#10151f; --hero-2:#172340;
  --orange:#ff8a4c; --orange-soft:#33200f; --teal:#3cc9b9; --teal-soft:#0f2b28; --sun:#f7c948; --sun-soft:#2e2610;
  --ok:#3dbe8b; --ok-soft:#12291f; --warn:#e3a53b; --warn-soft:#2b2210; --bad:#f2675c; --bad-soft:#2e1614;
  --banner-a:#1a47a8; --banner-b:#0e7d7a; --shadow:0 8px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1318; --panel:#171c23; --surface:#1b2129; --ink:#e8ecf1; --muted:#98a2b0; --line:#2a323c;
  --c-daily:#ff8a4c; --s-daily:#2f1c10; --c-unl:#a78bfa; --s-unl:#231a3d; --c-tot:#2dd4bf; --s-tot:#0f2a27; --accent:#6f9dff; --accent-soft:#162447; --dark:#e8ecf1; --dark-ink:#11161c; --hero:#10151f; --hero-2:#172340;
  --orange:#ff8a4c; --orange-soft:#33200f; --teal:#3cc9b9; --teal-soft:#0f2b28; --sun:#f7c948; --sun-soft:#2e2610;
  --ok:#3dbe8b; --ok-soft:#12291f; --warn:#e3a53b; --warn-soft:#2b2210; --bad:#f2675c; --bad-soft:#2e1614;
  --banner-a:#1a47a8; --banner-b:#0e7d7a; --shadow:0 8px 30px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;height:64px}
.top-in .brand{justify-self:start}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;text-decoration:none;color:var(--ink)}
.logo{display:inline-grid;place-items:center;height:30px;padding:0 7px;border-radius:9px;background:linear-gradient(135deg,var(--orange),#f59f00);color:#fff;font-weight:700;font-size:14px;letter-spacing:-.02em}
.btn-orange{background:#d9480f;color:#fff}
.btn-orange:hover{background:#c2410c}
.brand i{font-style:normal;font-size:11px;font-weight:600;letter-spacing:.08em;padding:2px 6px;border-radius:5px;background:var(--dark);color:var(--dark-ink)}
.nav{display:flex;gap:4px;justify-self:center;background:var(--panel);padding:4px;border-radius:999px}
.nav button{padding:8px 16px;border-radius:999px;color:var(--muted);font-weight:500;white-space:nowrap;transition:background .15s,color .15s}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{color:var(--ink);background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.top-actions{justify-self:end;display:flex;gap:6px;align-items:center}
.icon-btn{position:relative;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--ink)}
.icon-btn:hover{background:var(--panel)}
.icon-btn svg{width:22px;height:22px}
.badge{position:absolute;top:3px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center}
@media (max-width:900px){.nav{display:none}.top-in{grid-template-columns:1fr auto}}
@media (max-width:640px){.brand{font-size:16px}}

/* shop */
.page-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-block:24px 16px}
.page-title h1{font-size:26px;font-weight:700}
.shop{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:28px;align-items:start;padding-bottom:140px}
@media (max-width:920px){.shop{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}

.dest{background:var(--panel);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:16px}
.dest-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dest-name{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:700;min-width:0}
.dest-name small{display:block;font-size:13px;font-weight:500;color:var(--muted)}
.seg{display:inline-flex;background:var(--line);border-radius:999px;padding:4px}
.seg button{padding:7px 18px;border-radius:999px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pop-label{font-size:14px;color:var(--muted);margin-right:4px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;white-space:nowrap}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--dark);border-color:var(--dark);color:var(--dark-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:12px;font-weight:600;white-space:nowrap}
.btn-dark{background:var(--dark);color:var(--dark-ink)}
.btn-accent{background:var(--accent);color:#fff}
.btn-line{border:1px solid var(--line);background:var(--surface)}
.btn-sm{height:34px;padding:0 14px;border-radius:999px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.flag{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:20px;line-height:1;flex:none;overflow:hidden;background:var(--panel);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.flag img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.flag-lg{width:34px;height:34px;font-size:28px}
.flag-txt{background:var(--accent-soft);color:var(--accent);font-family:var(--f-mono);font-size:10px;font-weight:500}
.flag-lg.flag-txt{font-size:12px}
.flag-multi{background:var(--accent-soft);color:var(--accent)}
.flag-multi svg{width:62%;height:62%}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.tabs button{padding:14px 4px;font-size:18px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.opts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tab-note{font-size:13px;color:var(--muted);margin:0}

.rows{display:flex;flex-direction:column;gap:10px;max-height:560px;overflow-y:auto;padding:2px 6px 2px 2px;overscroll-behavior:contain}
.row{display:grid;grid-template-columns:22px 76px minmax(0,1fr) auto;align-items:center;gap:14px;padding:18px 20px;border:1px solid var(--line);border-radius:16px;background:var(--surface);text-align:left;width:100%}
.row:hover{border-color:var(--muted)}
.row[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft)}
.box{width:20px;height:20px;border:1.5px solid var(--muted);border-radius:5px;display:grid;place-items:center}
.row[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.box svg{width:14px;height:14px;color:#fff;opacity:0}
.row[aria-pressed="true"] .box svg{opacity:1}
.row-days{font-size:20px;font-weight:600;color:var(--accent)}
.row-main{min-width:0}
.row-main b{display:block;font-size:17px}
.row-main span{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.row-main svg{width:14px;height:14px;flex:none}
.row-price{font-size:19px;font-weight:600}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:2px}
@media (max-width:520px){.row{grid-template-columns:20px 54px minmax(0,1fr);row-gap:4px;padding:14px}.row-price{grid-column:3}.row-days{font-size:17px}}

.banner{position:relative;overflow:hidden;border-radius:20px;padding:32px 28px;min-height:190px;color:#fff;background:linear-gradient(115deg,var(--banner-a),var(--banner-b))}
.banner h2{font-size:26px;font-weight:700;max-width:13em;padding-right:120px;position:relative;z-index:1;box-sizing:content-box}
.banner p{margin:10px 0 0;opacity:.92;max-width:22em;position:relative;z-index:1}
.banner .txt{max-width:calc(100% - 130px)}
.banner .txt h2{padding-right:0;max-width:none}
.banner .orb{position:absolute;right:-60px;top:-70px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.12)}
.banner .globe{position:absolute;right:26px;bottom:-26px;width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.55),transparent 40%),radial-gradient(circle at 60% 60%,#3d9b4a 0 22%,transparent 23%),radial-gradient(circle at 30% 68%,#3d9b4a 0 14%,transparent 15%),radial-gradient(circle at 70% 25%,#3d9b4a 0 12%,transparent 13%),#6cc3f0}
.banner .plane{position:absolute;right:120px;top:22px;width:46px;height:46px;opacity:.95}
@media (max-width:520px){.banner .globe{width:84px;height:84px;right:10px}.banner .plane{display:none}.banner h2{font-size:22px}}

.acc{border:1px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden}
.acc details+details{border-top:1px solid var(--line)}
.acc summary{list-style:none;display:grid;grid-template-columns:32px minmax(0,1fr) 20px;gap:14px;align-items:center;padding:20px 22px;cursor:pointer}
.acc summary::-webkit-details-marker{display:none}
.acc summary b{display:block;font-size:16px}
.acc summary span{font-size:13px;color:var(--muted)}
.acc summary .ic{width:30px;height:30px;color:var(--accent)}
.acc summary .chev{width:20px;height:20px;transition:transform .2s}
.acc details[open] .chev{transform:rotate(180deg)}
.acc-body{padding:0 22px 20px 68px;font-size:14px;color:var(--muted)}
.acc-body ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.acc-body li b{color:var(--ink);font-weight:600}

.devcard{display:flex;align-items:center;gap:16px;padding:22px 24px;border-radius:18px;background:var(--panel);text-align:left;width:100%}
.devcard b{display:block;font-size:17px}
.devcard span{font-size:14px;color:var(--muted)}
.devcard .ph{margin-left:auto;width:44px;height:52px;color:var(--accent);flex:none}
.devcard.ok{background:var(--ok-soft)}
.devcard.ok b{color:var(--ok)}

.usimcard{padding:22px 24px;border-radius:18px;background:var(--panel)}
.usimcard b{display:block;font-size:17px;margin-bottom:6px}
.usimcard ul{margin:0;padding-left:18px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}

/* buy bar */
.buybar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.06);padding-bottom:env(safe-area-inset-bottom,0px)}
.buybar-in{display:flex;align-items:center;gap:16px;padding-block:14px;flex-wrap:wrap}
.buy-sel{min-width:0;flex:1 1 260px;display:flex;align-items:center;gap:12px}
.buy-sel b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.buy-sel>div{min-width:0}
.buy-sel span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;height:40px}
.qty button{width:36px;height:100%;font-size:18px}
.qty output{min-width:28px;text-align:center;font-weight:600}
.buy-total{font-size:20px;font-weight:700;min-width:110px;text-align:right}
.buy-actions{display:flex;gap:8px}
@media (max-width:640px){.buy-total{min-width:0;text-align:left}.buy-actions{flex:1 1 100%}.buy-actions .btn{flex:1}}

/* overlays */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(10,15,22,.45);display:flex;padding:16px}
.modal{margin:auto;width:min(720px,100%);max-height:calc(100% - 8px);background:var(--surface);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.modal-sm{width:min(520px,100%)}
.modal-head{display:flex;align-items:center;gap:12px;padding:22px 24px 12px}
.modal-head h2{font-size:22px;font-weight:700}
.x{margin-left:auto;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.x:hover{background:var(--panel)}
.x svg{width:20px;height:20px}
.modal-body{padding:8px 24px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.drawer{margin:0 0 0 auto;width:min(460px,100%);height:100%;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.drawer-foot{border-top:1px solid var(--line);padding:16px 24px;display:flex;flex-direction:column;gap:12px}

.search{display:flex;gap:10px}
.search label{flex:1;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:0 16px;height:56px;background:var(--surface);min-width:0}
.search label:focus-within{border-color:var(--accent)}
.search svg{width:20px;height:20px;color:var(--muted);flex:none}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:16px}
.ptabs{display:flex;gap:24px;border-bottom:1px solid var(--line)}
.ptabs button{padding:10px 0;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.ptabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:480px){.cgrid{grid-template-columns:minmax(0,1fr)}}
.citem{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;text-align:left;min-width:0}
.citem:hover{border-color:var(--muted)}
.citem[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.citem .nm{min-width:0;flex:1}
.citem .nm b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citem .nm span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citem .ck{width:18px;height:18px;color:var(--accent);flex:none}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}

/* device check */
.steps{display:flex;flex-wrap:wrap;gap:8px}
.mlist{display:flex;flex-direction:column;gap:8px}
.mlist button{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border:1px solid var(--line);border-radius:12px;text-align:left}
.mlist button:hover{border-color:var(--muted)}
.result{border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.result.ok{background:var(--ok-soft)}
.result.ok b{color:var(--ok)}
.result.bad{background:var(--bad-soft)}
.result.bad b{color:var(--bad)}
.result.info{background:var(--warn-soft)}
.result.info b{color:var(--warn)}
.result p{margin:0;font-size:14px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
.note{font-size:13px;color:var(--muted);margin:0}

/* cart */
.citems{display:flex;flex-direction:column;gap:12px}
.ci{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:start;padding:14px;border:1px solid var(--line);border-radius:14px}
.ci b{display:block}
.ci .meta{font-size:13px;color:var(--muted)}
.ci-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-esim{background:var(--teal-soft);color:var(--teal)}
.p-usim{background:var(--accent-soft);color:var(--accent)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:var(--accent-soft);color:var(--accent)}
.p-muted{background:var(--panel);color:var(--muted)}
.linkbtn{color:var(--muted);font-size:13px;text-decoration:underline}
.sumline{display:flex;justify-content:space-between;font-size:14px}
.sumline.big{font-size:18px;font-weight:700}

/* checkout */
.co{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;align-items:start;padding-block:8px 60px}
@media (max-width:920px){.co{grid-template-columns:minmax(0,1fr)}}
.card{border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:22px;display:flex;flex-direction:column;gap:16px}
.card h3{font-size:17px;font-weight:700}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:560px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:13px;font-weight:600}

@media (prefers-reduced-motion:no-preference){
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(8deg)}50%{transform:translateY(-8px) rotate(5deg)}}
  @keyframes drift{0%{transform:translateX(0)}100%{transform:translateX(26px)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @keyframes spinslow{to{transform:rotate(360deg)}}
  @keyframes grow{0%{transform:scaleY(.15)}100%{transform:scaleY(1)}}
  @keyframes fillx{0%,10%{transform:scaleX(.2)}60%,100%{transform:scaleX(1)}}
  @keyframes twinkle{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes flow{to{stroke-dashoffset:-100}}
  @keyframes dash{to{stroke-dashoffset:-140}}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(124,240,169,.6)}100%{box-shadow:0 0 0 10px rgba(124,240,169,0)}}
  .ill-plane,.pband-plane,.promo-plane,.banner .plane{animation:floaty 4.5s ease-in-out infinite}
  .ill-cloud{animation:drift 9s ease-in-out infinite alternate}
  .ill-cloud.sm{animation-duration:12s}
  .floatcard{animation:bob 5s ease-in-out infinite}
  .floatcard.top{animation-delay:-2.5s}
  .ill-sim{animation:bob 5s ease-in-out infinite}
  .scene-tag .dot{animation:pulse 1.8s ease-out infinite}
  .ill-path .dash{animation:dash 6s linear infinite}
  .ab{animation:grow 1.4s cubic-bezier(.3,1.4,.5,1) both}
  .fillx{animation:fillx 3.5s ease-in-out infinite alternate}
  .tw{animation:twinkle 2.4s ease-in-out infinite}
  .flow{animation:flow 2.6s linear infinite}
  .tc-ill svg{animation:bob 4s ease-in-out infinite}
  .ptype:hover .pt-ill svg,.ptype[aria-pressed="true"] .pt-ill svg{animation:bob 2.4s ease-in-out infinite}
  .st-ill svg{transition:transform .25s}
  .step:hover .st-ill svg{transform:translateY(-4px) rotate(-4deg)}
  .dcard .flag{transition:transform .2s}
  .dcard:hover .flag{transform:scale(1.12)}
}

","Open the phone app and dial <1>*#06#</1>. If you see a number labeled <2>EID</2>, your phone supports eSIM.":"전화 앱을 열고 <1>*#06#</1>을 누르세요. <2>EID</2>라고 표시된 번호가 보이면 eSIM을 지원하는 휴대폰이에요.","Open your main line and turn <1>Data Roaming off</1>.":"기존 회선을 열고 <1>데이터 로밍을 끄세요</1>.","Operators":"통신사","Order details: plan, destination, travel date and phone model.":"주문 정보: 요금제, 여행지, 여행 날짜, 휴대폰 모델.","Order found":"주문을 찾았어요","Order number":"주문번호","Order placed":"주문 접수","Order records are kept for 5 years as required by Korean e-commerce law, then deleted.":"주문 기록은 대한민국 전자상거래법에 따라 5년간 보관한 후 삭제합니다.","Order summary":"주문 요약","Order tracking isn't connected yet.":"주문 조회가 아직 연결되지 않았어요.","Ordered on another device? Enter your order number and the email you used.":"다른 기기에서 주문하셨나요? 주문번호와 주문 시 사용한 이메일을 입력하세요.","Orders and refunds":"주문 및 환불","Orders are saved to your account. Sign in to claude.ai with access to this store to place an order.":"주문은 계정에 저장돼요. 주문하려면 이 스토어에 접근할 수 있는 계정으로 claude.ai에 로그인하세요.","Other":"기타","Our plans are designed for normal personal use while travelling: browsing, maps, messaging, social media, video calls and streaming.":"저희 요금제는 여행 중 일반적인 개인 사용(웹 서핑, 지도, 메신저, SNS, 영상 통화, 스트리밍)을 위한 것입니다.","Our plans are eSIM only, so this phone won't work with them. If you're travelling with another phone, check that one instead.":"저희 요금제는 eSIM 전용이라 이 휴대폰으로는 이용할 수 없어요. 다른 휴대폰을 가져가신다면 그 휴대폰을 확인해 보세요.","Overseas models only":"해외 모델만 지원","Package":"패키지","Paid":"결제 완료","Pay by":"입금 기한","Pay by Korean bank transfer, then tap “I've sent the transfer”. Check your phone supports eSIM first.":"한국 계좌이체로 결제한 뒤 “송금했어요”를 누르세요. 먼저 휴대폰이 eSIM을 지원하는지 확인하세요.","Pay for what you use":"쓰는 만큼만 결제","Pay from any Korean bank account or app (Toss, KakaoBank and others).":"한국의 모든 은행 계좌나 앱(토스, 카카오뱅크 등)에서 결제할 수 있습니다.","Pay {0}":"{0} 결제하기","Payment":"결제","Payment complete":"결제 완료","Payment confirmed":"결제 확인됨","Payment received. Your eSIM is being prepared and will appear here and in your email {0}.":"결제가 확인됐어요. eSIM을 준비 중이며, {0} 여기와 이메일에서 확인하실 수 있어요.","Payment status. Card details are handled by the payment provider and never stored by us.":"결제 상태. 카드 정보는 결제 대행사가 처리하며 저희는 저장하지 않습니다.","Philippine peso":"필리핀 페소","Phone":"전화번호","Phone is eSIM-compatible and carrier-unlocked":"eSIM 지원 및 통신사 잠금 해제 휴대폰","Phone or WhatsApp (with country code)":"전화번호 또는 WhatsApp (국가번호 포함)","Pick 500MB to 5GB of full-speed data a day. After that you stay online at a slower speed for maps and messaging until tomorrow.":"매일 500MB에서 5GB까지 고속 데이터 용량을 선택하세요. 소진 후에는 다음 날까지 지도와 메신저를 쓸 수 있는 저속으로 계속 연결돼요.","Pick a destination and a plan to get started.":"여행지와 요금제를 선택해 시작하세요.","Pick a destination and plan":"여행지와 요금제 선택","Pick how you use data":"데이터 사용 패턴 선택","Picked for you: {0}":"추천 요금제: {0}","Pixel 2 or older":"Pixel 2 이전 모델","Pixel 3a series":"Pixel 3a 시리즈","Pixel 4 / 5 series":"Pixel 4 / 5 시리즈","Pixel 6 or newer":"Pixel 6 이후 모델","Place order · {0}":"주문하기 · {0}","Place your order. Nothing is charged yet.":"주문을 접수하세요. 아직 결제되지 않아요.","Placing order…":"주문 접수 중…","Plan":"요금제","Plan details":"요금제 상세","Plans are for personal use. We may limit speed or suspend a plan that is resold, used for automated traffic, or used in a way that harms the network. See the fair usage policy.":"요금제는 개인 사용 목적입니다. 재판매하거나, 자동화된 트래픽에 사용하거나, 네트워크에 피해를 주는 방식으로 사용하는 경우 속도를 제한하거나 요금제를 정지할 수 있습니다. 공정 이용 정책을 참고하세요.","Please confirm your phone supports eSIM and accept the terms.":"휴대폰의 eSIM 지원 여부를 확인하고 약관에 동의해 주세요.","Please read before ordering":"주문 전 꼭 읽어주세요","Policies":"정책","Popular":"인기","Popular destinations":"인기 여행지","Prices are charged in Korean won (KRW). Prices shown in other currencies are estimates only.":"가격은 대한민국 원(KRW)으로 결제됩니다. 다른 통화로 표시된 가격은 예상 금액입니다.","Prices in other currencies are estimates. Payment is always charged in Korean won (KRW).":"다른 통화로 표시된 가격은 예상 금액이에요. 결제는 항상 대한민국 원(KRW)으로 이루어져요.","Prices in {0} are approximate. You'll be charged <b>{1}</b> in Korean won.":"{0} 가격은 대략적인 금액이에요. 실제로는 대한민국 원으로 <b>{1}</b>이 결제돼 k.":"보통은 어려워요. QR 코드는 한 번만 사용할 수 있어요. 주문번호와 함께 문의해 주시면 통신사에 확인해 드릴게요.","Uzbekistani som":"우즈베키스탄 숨","Valid {0} days":"{0}일간 유효","Valid {0} days · then {1}":"{0}일간 유효 · 이후 {1}","Validity":"유효기간","Video, hotspot, work":"영상, 핫스팟, 업무","Vietnamese dong":"베트남 동","View my orders":"내 주문 보기","We are not liable for losses caused by network outages, roaming restrictions or phone settings outside our control. Our liability is limited to the price you paid for the plan.":"당사가 통제할 수 없는 네트워크 장애, 로밍 제한 또는 휴대폰 설정으로 인한 손해에 대해서는 책임지지 않습니다. 당사의 책임은 고객이 요금제에 지불한 금액으로 한정됩니다.","We collect only what we need to deliver your eSIM and support your order.":"eSIM 전송과 주문 지원에 필요한 정보만 수집합니다.","We couldn't find an order with that number and email.":"해당 주문번호와 이메일로 주문을 찾을 수 없어요.","We email your eSIM QR code and install codes after payment is confirmed, and it also appears in My orders. Bank transfers are confirmed as soon as we see the deposit, usually within business hours. Tap “I've sent the transfer” after paying so we check right away.":"결제가 확인되면 eSIM QR 코드와 설치 코드를 이메일로 보내드리며, 내 주문에도 표시돼요. 계좌이체는 입금이 확인되는 즉시, 보통 영업시간 내에 처리돼요. 입금 후 “송금했어요”를 탭하시면 바로 확인해 드려요.","We may slow down or suspend a plan that breaks these rules, without refund.":"이 규정을 위반한 요금제는 환불 없이 속도를 제한하거나 정지할 수 있습니다.","We sell prepaid, data-only eSIM plans for use outside Korea. Plans do not include a phone number, voice calls or SMS. Coverage and speed depend on the local partner network at your destination.":"당사는 대한민국 외 지역에서 사용하는 선불 데이터 전용 eSIM 요금제를 판매합니다. 요금제에는 전화번호, 음성 통화, 문자가 포함되지 않습니다. 이용 지역과 속도는 여행지의 현지 제휴 통신망에 따라 달라집니다.","We share the minimum required with our eSIM network partner and payment provider. We do not sell your data.":"eSIM 네트워크 제휴사와 결제 대행사에 필요한 최소한의 정보만 제공합니다. 고객의 정보를 판매하지 않습니다.","We'll email our bank details to {0}.":"{0} 주소로 입금 계좌 정보를 보내드릴게요.","What happens next":"다음 단계","What happens when my daily data runs out?":"일일 데이터를 다 쓰면 어떻게 되나요?","What is an eSIM?":"eSIM이 무엇인가요?","What we collect":"수집 항목","When do I get my e   const INL = new Set(["B","STRONG","EM","I","BR","U"]), SKIP = new Set(["SCRIPT","STYLE","svg","SVG","TEXTAREA","OUTPUT","CODE"]);

    if (D[key]!=null) return D[key];

    return null;
  }
  function elKey(el){
    let key="", kids=[], text=false;
    for (const n of el.childNodes){
      if (n.nodeType===3){ if (n.nodeValue.trim()) text=true; key+=n.nodeValue; }
      else if (n.nodeType===1){ if (!inl(n)) return null; if (n.tagName==="BR"){ key+="<br>"; continue; } if (n.children.length) return null; kids.push(n); key+=`<${kids.length}>${n.textContent}</${kids.length}>`; }
    }
    return text && kids.length ? {key:norm(key), kids} : null;
  }
  function build(el, tr, kids){
    const f=document.createDocumentFragment(); const re=/<(\d)>(.*?)<\/\1>|<br>/g; let last=0, m;
    while ((m=re.exec(tr))){ if (m.index>last) f.append(tr.slice(last,m.index)); if (m[0]==="<br>") f.append(document.createElement("br")); else { const k=kids[m[1]-1]; if (k){ const c=k.cloneNode(false); c.textContent=m[2]; f.append(c); } else f.append(m[2]); } last=re.lastIndex; }
    if (last<tr.length) f.append(tr.slice(last));
    el.replaceChildren(f);

    if (LANG==="en" || !root || root.nodeType!==1) return;

      const el=stack.pop();

      for (const a of ["placeholder","aria-label","title"]){ const v=el.getAttribute(a); if (v && /[A-Za-z]/.test(v)){ const tr=look(norm(v)); if (tr && tr!==v) el.setAttribute(a,tr); } }

      if (ek){ const tr=look(ek.key); if (tr!=null){ if (tr!==ek.key) build(el,tr,ek.kids); continue; } if (window.__keys) continue; }

        if (n.nodeType===3){ const raw=n.nodeValue, k=norm(raw); if (k && /[A-Za-z]/.test(k)){ const tr=look(k); if (tr!=null && tr!==k) n.nodeValue = raw.match(/^\s*/)[0] + tr + raw.match(/\s*$/)[0]; } }
        else stack.push(n);

  }

    if (LANG==="en") return;
    const seen=new Set();
    for (const r of recs){
      if (r.type==="childList") r.addedNodes.forEach(n=>{ if (n.nodeType===1) seen.add(n); else if (n.nodeType===3 && n.parentNode) seen.add(n.parentNode); });
      else if (r.target) seen.add(r.type==="characterData" ? r.target.parentNode : r.target);

})();

function validate(){
  const e = {}, F = S.form;
  if (!F.name?.trim()) e.name = "Enter your name.";
  if (!/^\S+@\S+\.\S+$/.test((F.email||"").trim())) e.email = "Enter a valid email address.";
  if ((F.phone||"").replace(/\D/g,"").length < 8) e.phone = "Enter a phone number we can reach you on.";
  if (!e.email && (F.email2||"").trim().toLowerCase()!==(F.email||"").trim().toLowerCase()) e.email2 = "The two emails don't match.";
  if (cartHas("esim") && !S.device) e._ = "Check eSIM support for your phone first.";
  if (F.pay==="bank" && !(F.depositor||F.name||"").trim()) e.depositor = "Enter the name that will appear on your transfer.";
  if (!F.agree) e.agree = "Please confirm your phone supports eSIM and accept the terms.";
  return e;
}
function genCode(){ const d=new Date(); const p=n=>String(n).padStart(2,"0"); const r=Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[b%32]).join(""); return `TS${String(d.getFullYear()).slice(2)}${p(d.getMonth()+1)}${p(d.getDate())}-${r}`; }
async function submitOrder(payStatus, payRef){
  if (FB_MODE) return submitOrderFB();
  if (!S.db || !S.uid){ S.errors={_:"This view can't save orders. Open the store signed in to claude.ai with Contributor access or higher."}; renderCheckout(); return; }
  const F = S.form;
  const order = {
    id: genCode(), uid:S.uid, createdAt:new Date().toISOString(),
    customer:{name:F.name.trim(), email:F.email.trim(), phone:F.phone.trim()}, depart:F.depart,
    items:S.cart.map(it=>{const d=byId[it.dest],p=inEn(()=>planOf(it));return {dest:it.dest, destName:d.name, sim:it.sim, kind:it.kind, opt:it.opt, days:it.days, title:p.title, sup:supRef(it), unit:p.price, qty:it.qty}}),
    device: cartHas("esim") ? S.device : null,
    delivery: {method:"email"},
    subtotal: cartTotal(), shipping: shipFee(), total: cartTotal()+shipFee(),
    payment:{method:F.pay, status:payStatus, ref:payRef||null, depositor:(F.depositor||F.name||"").trim()}
  };
  S.submitting = true; renderCheckout();
  try {
    const ref = S.db.doc("orders/"+S.uid);
    const snap = await ref.get();
    const arr = snap.exists ? JSON.parse(JSON.stringify(snap.data().orders||[])) : [];
    arr.push(order);
    await ref.set({orders:arr});
    S.cart = []; ls.set("wl-cart", []); updateBadge();
    S.lastOrder = order; S.coStage = "done"; S.errors = {};
  } catch(err) {
    S.errors = {_: err?.code==="invalid_argument" ? "Your account can view this store but can't place orders. Ask the store owner for Contributor access." : err?.code==="quota_exceeded" ? "The order book is full. Please contact support." : "Couldn't place the order. Check your connection and try again."};
  }
  S.submitting = false; renderCheckout(); window.scrollTo(0,0);
}
function buildOrder(payStatus, payRef){
  const F = S.form;
  return {
    id: genCode(), createdAt:new Date().toISOString(),
    customer:{name:F.name.trim(), email:F.email.trim(), phone:F.phone.trim()}, depart:F.depart,
    items:S.cart.map(it=>{const d=byId[it.dest],p=inEn(()=>planOf(it));return {dest:it.dest, destName:d.name, sim:it.sim, kind:it.kind, opt:String(it.opt), days:it.days, title:p.title, sup:supRef(it), unit:p.price, qty:it.qty}}),
    device: cartHas("esim") ? S.device : null,
    delivery: {method:"email"},
    subtotal: cartTotal(), shipping: shipFee(), total: cartTotal()+shipFee(),
    currencyShown: S.cur, lang: LANG,
    payment:{method:F.pay, status:payStatus, ref:payRef||null, depositor:(F.depositor||F.name||"").trim()},
    status:{order:"new", pay:payStatus}
  };
}
async function submitOrderFB(){

    const mine = ls.get("ts-orders", []); mine.unshift({id:order.id, email:order.customer.email.toLowerCase()}); ls.set("ts-orders", mine.slice(0,30));

}
const FB_SUBS = {};
function watchMyOrders(){
  for (const {id} of ls.get("ts-orders", [])){

      S.mine = S.mine.filter(o=>o.id!==id);
      if (snap.exists) S.mine.push(snap.data());
      if (S.view==="orders") renderOrders();
    }, ()=>{});

}
async function lookupOrder(){

async function claimTransfer(id){

    else { const ref=S.db.doc("orders/"+S.uid); const snap=await ref.get(); const arr=snap.exists?JSON.parse(JSON.stringify(snap.data().orders||[])):[]; const k=arr.findIndex(x=>x.id===id); if (k<0) throw new Error("not found"); arr[k].transferClaim=claim; await ref.set({orders:arr}); }
    o.transferClaim = claim; const m=S.mine.find(x=>x.id===id); if (m) m.transferClaim=claim;

function adminRows(){

    const st = eff(o);

    if (fx==="pending" && st.pay!=="pending") return false;
    if (fx==="claimed" && !(st.pay==="pending" && o.transferClaim && st.order!=="cancelled")) return false;
    if (fx==="fulfil" && !(st.pay==="paid" && (st.order==="new"||st.order==="processing"))) return false;

async function saveStatus(id, patch){

  const entry = {...(S.status[id]||{}), ...patch, updatedAt:new Date().toISOString()};
  const ref = S.db.doc("admin/status");
  try { await ref.update({m:{[id]:entry}}); }
  catch(e){ if (e?.code==="invalid_argument"){ const snap=await ref.get(); if (!snap.exists) await ref.set({m:{[id]:entry}}); else throw e; } else throw e; }
}

const POLICIES = {
  terms:["Terms of service", s => `<p>${t("These terms apply to every eSIM data plan bought from 365 Travel SIM{0}. By placing an order you agree to them.", s.companyName?" "+t("(operated by {0})", esc(s.companyName)):"")}</p>

    <h4>4. Validity</h4><p>A plan's validity starts when the eSIM first connects to a network at the destination and runs in 24-hour blocks. Unused days or data cannot be carried over or refunded after activation.</p>
    <h4>5. Fair use</h4><p>Plans are for personal use. We may limit speed or suspend a plan that is resold, used for automated traffic, or used in a way that harms the network. See the fair usage policy.</p>
    <h4>6. Prices and payment</h4><p>Prices are charged in Korean won (KRW). Prices shown in other currencies are estimates only.</p>
    <h4>7. Liability</h4><p>We are not liable for losses caused by network outages, roaming restrictions or phone settings outside our control. Our liability is limited to the price you paid for the plan.</p>
    <h4>8. Contact</h4><p>${t("Questions about these terms: {0}.", esc(s.supportEmail||t("see Contact us")))}</p>`],
  refund:["Refund policy", s => `<h4>Full refund</h4><ul><li>The eSIM has <b>not been installed</b> (QR code not scanned), and the request is made within <b>30 days</b> of purchase.</li><li>The eSIM can't connect because of a problem on our side or the partner network, and we can't fix it. We'll first try to replace it.</li></ul>
    <h4>No refund</h4><ul><li>The eSIM has been installed and has connected to a network at the destination.</li><li>The phone isn't eSIM-compatible or is carrier-locked.</li><li>Unused days or data after activation.</li><li>The eSIM was deleted from the phone by the customer.</li></ul>
    <h4>How to ask for a refund</h4><p>Contact us with your order number and the email used to order. Refunds go back to the original payment method within 3–7 business days after approval.</p>`],
  privacy:["Privacy policy", s => `<p>We collect only what we need to deliver your eSIM and support your order.</p>
    <h4>What we collect</h4><ul><li>Name, email address and phone number.</li><li>Order details: plan, destination, travel date and phone model.</li><li>Payment status. Card details are handled by the payment provider and never stored by us.</li></ul>
    <h4>Why</h4><ul><li>To send your eSIM and order updates.</li><li>To help when there's a problem with your eSIM.</li><li>To meet legal and accounting requirements.</li></ul>
    <h4>Sharing</h4><p>We share the minimum required with our eSIM network partner and payment provider. We do not sell your data.</p>

  fair:["Fair usage policy", s => `<p>Our plans are designed for normal personal use while travelling: browsing, maps, messaging, social media, video calls and streaming.</p>
    <ul><li>When the daily full-speed allowance is used, speed is reduced until the next 24-hour block. The reduced speed for each plan is shown on the plan page.</li><li>Not allowed: reselling, SIM boxes, crypto mining, bulk downloading or automated traffic.</li><li>We may slow down or suspend a plan that breaks these rules, without refund.</li></ul>`]

      <div class="devgrid">${Object.entries(DEVICES).filter(([b])=>b!=="Other").map(([b,v])=>`<div class="card"><h3>${b}</h3><ul class="devlist">${v.models.map(([m,r])=>`<li><span>${esc(m)}</span><span class="pill ${r==="yes"?"p-ok":r==="no"?"p-bad":"p-warn"}">${r==="yes"?"Supported":r==="no"?"Not supported":r==="overseas"?"Overseas models only":"Check EID"}</span></li>`).join("")}</ul>${v.note?`<p class="note">${esc(v.note)}</p>`:""}</div>`).join("")}</div>`;
  } else if (H.tab==="policies"){
    const [title, fn] = POLICIES[H.pol];
    body = `<div class="opts">${Object.entries(POLICIES).map(([k,[t]])=>`<button class="chip" data-a="policy" data-v="${k}" aria-pressed="${H.pol===k}">${t}</button>`).join("")}</div>
      <article class="policy card"><h2>${title}</h2>${fn(s)}</article>`;
  } else {
    const ch = [s.supportEmail&&["Email",s.supportEmail], s.kakaoId&&["KakaoTalk",s.kakaoId], s.phone&&["Phone",s.phone]].filter(Boolean);
    body = `<div class="ctgrid">${ch.length?ch.map(([l,v])=>`<div class="card ct"><span class="muted">${l}</span><b class="mono">${esc(v)}</b><button class="btn btn-line btn-sm" data-a="copy" data-v="${esc(v)}">Copy</button></div>`).join(""):`<div class="card"><div class="empty">Contact details will be listed here soon.</div></div>`}</div>

  }
  const keep = document.activeElement?.id==="hc-q";
  $("#v-help").innerHTML = `<div class="wrap"><div class="hc-hero"><div><span class="eyebrow">Help center</span><h1>How can we help?</h1><p class="muted">Install guides, answers and policies for your travel eSIM.</p></div><div class="hc-art" aria-hidden="true">${PHONEQR}</div></div>
    <div class="hc-tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" data-a="help-tab" data-v="${k}" aria-selected="${H.tab===k}">${l}</button>`).join("")}</div>
    <div class="hc-body">${body}</div></div>${footerHtml()}`;
  if (keep){ const i=$("#hc-q"); i.focus(); i.setSelectionRange(i.value.length,i.value.length); }

function renderSugg(){
  const box = $("#h-sugg"); if (!box) return;
  const q = S.home.q.trim(); if (!q){ box.innerHTML=""; return; }
  const ql = q.toLowerCase();
  const st = d => d.name.toLowerCase().startsWith(ql) || dn(d).toLowerCase().startsWith(ql);
  const m = DEST.filter(d=>dmatch(d,q)).sort((a,b)=>st(b)-st(a)).slice(0,6);
  box.innerHTML = `<div class="sugg">${m.length?m.map(d=>`<button data-a="go-dest" data-v="${d.id}">${flag(d)}<span><b>${esc(dn(d))}</b> <span class="muted">${esc(dsub(d))}</span></span><span class="pr">${t("from {0}", won(fromPrice(d)))}</span></button>`).join(""):`<div class="empty" style="padding:14px">${t("No match for “{0}”. Try the English or Korean name.", esc(q))}</div>`}</div>`;
}

function rerenderAll(full){
  updateLocLabel();
  if (S.view==="home") renderHome();
  if (S.view==="shop") renderShop();
  if (S.view==="checkout") renderCheckout();
  if (S.view==="orders") renderOrders();
  if (full && S.view==="help") renderHelp();
  renderBuybar();

/* ============ navigation ============ */
/* The address bar keeps the page (#shop/JP, #help/install) so links can be shared and the Back button works */
const viewHash = () => "#" + S.view + (S.view==="shop" ? "/"+S.dest : S.view==="help" ? "/"+S.help.tab : "");
let NAV_POP = false, BOOTED = false;
function syncHash(replace){
  const h = viewHash(); if (location.hash===h) return;
  try { history[(replace||NAV_POP||!BOOTED) ? "replaceState" : "pushState"](null, "", h); } catch(e){}
}
function parseHash(){
  const [v, arg] = (location.hash||"").slice(1).split("/");
  if (v==="shop" && arg && SUP.C[arg]) S.dest = arg;
  if (v==="help" && ["faq","install","devices","policies","contact"].includes(arg)) S.help.tab = arg;
  return v;
}
const VIEWS = () => ["home","shop","orders","checkout","help"].concat(ADMIN_PAGE||!FB_MODE?["admin"]:[]);
function go(v){
  const changed = S.view!==v;
  if (changed){ const sec=$("#v-"+v); if (sec){ sec.classList.remove("enter"); void sec.offsetWidth; sec.classList.add("enter"); } }
  S.view = v;
  syncHash(!changed);
  for (const id of ["home","shop","checkout","orders","admin","help"]) $("#v-"+id).hidden = id!==v;
  document.body.classList.toggle("is-admin", v==="admin");
  document.body.dataset.view = v;
  markNav();
  if (v==="home") renderHome();
  if (v==="help") renderHelp();
  if (v==="shop") renderShop();
  if (v==="checkout") renderCheckout();
  if (v==="orders") renderOrders();
  if (v==="admin") renderAdmin();
  renderBuybar();
  window.scrollTo(0,0);
}
window.addEventListener("popstate", () => {
  NAV_POP = true;
  try { closeAll(); const v = parseHash(); go(VIEWS().includes(v) ? v : "home"); } finally { NAV_POP = false; }
});
/* sections fade in as they scroll into view */
const RV = ("IntersectionObserver" in window) && !(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)
  ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add("rv-in"); RV.unobserve(e.target); } }), {rootMargin:"0px 0px -6% 0px"}) : null;
function reveal(sel){
  if (!RV || window.__noRV) return;
  document.querySelectorAll(sel).forEach(el => { if (el.getBoundingClientRect().top > innerHeight*0.92){ el.classList.add("rv"); RV.observe(el); } });
}
window.addEventListener("scroll", () => {
  const y = window.scrollY;
  document.body.classList.toggle("scrolled", y>8);
  const b = $("#totop"); if (b) b.hidden = y<900 || S.view==="admin";
}, {passive:true});
let toastT; function toast(m){ const el=$("#toast"); el.innerHTML=`<span class="toast-ic">${ICON.check}</span><span></span>`; el.lastChild.textContent=t(m); el.hidden=false; el.classList.remove("show"); void el.offsetWidth; el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,2800); }
function closeAll(){ for (const id of ["o-picker","o-device","o-cart","o-pay","o-order","o-locale"]) $("#"+id).hidden=true; S.adm.open=null; }

/* ============ events ============ */
document.addEventListener("click", async e => {
  const ov = e.target.classList?.contains("overlay") ? e.target : null;
  if (ov){ ov.hidden = true; if (ov.id==="o-order") S.adm.open=null; return; }
  if (!e.target.closest(".hsearch") && $("#h-sugg")?.innerHTML){ $("#h-sugg").innerHTML=""; }
  const t = e.target.closest("[data-a]"); if (!t) return;
  const a = t.dataset.a, v = t.dataset.v;
  if (t.tagName==="A") e.preventDefault();
  switch (a){
    case "nav": closeAll(); if (v==="checkout"||v==="shop") S.coStage = S.coStage==="done"&&v==="shop" ? "form" : S.coStage; go(v); break;
    case "sim": S.sim=v; renderShop(); break;
    case "dest": S.dest=v; renderShop(); break;
    case "kind": S.kind=v; S.usage=null; renderShop(); break;
    case "opt": S.opt[t.dataset.k||S.kind]=v; S.usage=null; renderShop(); break;
    case "usage": { const r=recommend(v); if (!r) break; S.usage=v; S.kind=r.kind; S.opt[r.kind]=r.opt; renderShop(); toast(window.t("Picked for you: {0}", optName(planOf(curItem()).o))); document.getElementById("pcards")?.scrollIntoView({behavior:"smooth",block:"center"}); } break;
    case "theme": THEME.toggle(); break;
    case "set-lang": setLang(v); break;
    case "top": window.scrollTo({top:0,behavior:"smooth"}); break;
    case "share": { const url=location.href, title=dn(byId[S.dest])+" eSIM · 365 Travel SIM"; try { if (navigator.share) await navigator.share({title, url}); else { await navigator.clipboard.writeText(url); toast("Link copied"); } } catch(err){ if (err?.name!=="AbortError") toast("Couldn't copy the link."); } } break;
    case "days": S.days=+v; renderShop(); break;
    case "pd-toggle": S.pdOpen=!S.pdOpen; renderShop(); break;
    case "days-step": { const L=curDays(); const i=L.indexOf(S.days); S.days=L[Math.max(0,Math.min(L.length-1,(i<0?0:i)+(+v)))]; renderShop(); } break;
    case "to-dur": { const el=document.getElementById("dur"); if (el) el.scrollIntoView({behavior:"smooth",block:"center"}); } break;
    case "type-go": S.kind=v; S.dest=S.dest||"JP"; if (!availKinds(S.dest).includes(v)) S.dest="JP"; go("shop"); setTimeout(()=>document.getElementById("plans")?.scrollIntoView({block:"start"}),50); break;
    case "to-plans": document.getElementById("plans").scrollIntoView({behavior:"smooth",block:"start"}); break;
    case "qty": S.qty=Math.max(1,Math.min(20,S.qty+(+v))); renderShop(); break;
    case "add": addToCart(curItem(), S.qty); toast("Added to cart"); { const bd=$("#cart-n"); bd.classList.remove("bump"); void bd.offsetWidth; bd.classList.add("bump"); } break;
    case "buynow": buyNow(); break;
    case "open-picker": openPicker(); break;
    case "p-tab": S.picker.tab=v; S.picker.region="ALL"; renderPicker(); break;
    case "p-region": S.picker.region=v; renderPicker(); break;
    case "pick-dest": S.dest=v; S.usage=null; $("#o-picker").hidden=true; if (S.view!=="shop") go("shop"); else { renderShop(); window.scrollTo({top:0,behavior:"smooth"}); } break;
    case "go-dest": S.dest=v; S.usage=null; S.home.q=""; go("shop"); break;
    case "h-go": { const q=S.home.q.trim().toLowerCase(); const m=DEST.find(d=>d.name.toLowerCase().startsWith(q)||d.ko.startsWith(S.home.q.trim())||dn(d).toLowerCase().startsWith(q))||DEST.find(d=>dmatch(d,S.home.q)); if (q&&m){ S.dest=m.id; S.pick=null; S.home.q=""; go("shop"); } else openPicker(); } break;
    case "h-region": S.home.region=v; S.home.all=false; renderHome(); document.getElementById("regions").scrollIntoView({block:"start"}); break;
    case "h-all": S.home.all=!S.home.all; renderHome(); if(!S.home.all) document.getElementById("regions").scrollIntoView({block:"start"}); break;
    case "open-picker-home": openPicker(); break;
    case "faq-jump": case "help": closeAll(); S.help.tab = v||"faq"; go("help"); break;
    case "help-tab": S.help.tab=v; renderHelp(); markNav(); syncHash(true); break;
    case "help-os": S.help.os=v; renderHelp(); break;
    case "policy": closeAll(); S.help.tab="policies"; S.help.pol=v; go("help"); break;
    case "faq-iphone": closeAll(); S.help.tab="install"; S.help.os="ios"; go("help"); break;
    case "copy": try { await navigator.clipboard.writeText(v); toast("Copied"); } catch(err){ toast(v); } break;
    case "open-device": openDevice(t.dataset.then); break;
    case "dc-brand": S.dc={brand:v,model:null,result:null,unlock:false}; renderDevice(); break;
    case "dc-model": { const [m,r]=DEVICES[S.dc.brand].models[+v]; S.dc.model=m; S.dc.result=r; renderDevice(); } break;
    case "dc-res": S.dc.result=v; renderDevice(); break;
    case "dc-unlock": S.dc.unlock=t.checked; renderDevice(); break;
    case "dc-confirm":
      S.device={brand:S.dc.brand, model:S.dc.model}; ls.set("wl-device",S.device); $("#o-device").hidden=true;
      if (S.view==="shop"){ if (S.pending==="pay"){ buyNow(); break; } renderShop(); if (S.pending==="add"){ addToCart(curItem(), S.qty); toast("eSIM support confirmed · added to cart"); } else toast("eSIM support confirmed"); }
      if (S.view==="checkout"){ S.errors={}; renderCheckout(); }
      break;
    case "open-cart": renderCart(); $("#o-cart").hidden=false; break;
    case "c-qty": { const it=S.cart[+t.dataset.i]; it.qty=Math.max(1,Math.min(20,it.qty+(+v))); ls.set("wl-cart",S.cart); updateBadge(); renderCart(); if(S.view==="checkout") renderCheckout(); } break;
    case "c-rm": S.cart.splice(+t.dataset.i,1); ls.set("wl-cart",S.cart); updateBadge(); renderCart(); if(S.view==="checkout") renderCheckout(); break;
    case "checkout": $("#o-cart").hidden=true; S.coStage="form"; go("checkout"); break;
    case "place": {
      S.errors = validate(); if (Object.keys(S.errors).length){ renderCheckout(); const first=document.querySelector(".field.err input,.field.err textarea,.field.err select"); first?first.focus():null; return; }
      if (!S.dbReady){ S.errors={_:"Sign in to claude.ai to place an order."}; renderCheckout(); return; }
      if (S.form.pay==="bank") submitOrder("pending"); else openPay();
    } break;
    case "claim-transfer": claimTransfer(v); break;
    case "pay-ok": $("#o-pay").hidden=true; submitOrder("paid", "TEST-"+Math.random().toString(36).slice(2,10).toUpperCase()); break;
    case "new-order": S.coStage="form"; go("home"); break;
    case "close": { const o=t.closest(".overlay"); o.hidden=true; if(o.id==="o-order") S.adm.open=null; } break;
    case "adm-f": S.adm.f=v; renderAdmin(); break;
    case "adm-open": S.adm.open=v; renderOrderPanel(); break;
    case "adm-paid": case "adm-save": case "adm-send": {
      const id=S.adm.open; const patch = {pay: a==="adm-paid" ? "paid" : $("#od-pay").value, order:$("#od-st").value, tracking:$("#od-trk").value.trim(), iccid:$("#od-trk").value.trim(), smdp:$("#od-smdp").value.trim(), acode:$("#od-acode").value.trim(), note:$("#od-note").value.trim()};
      if (a==="adm-send"){ if (!patch.smdp || !patch.acode){ toast("Add the SM-DP+ address and activation code first."); break; } patch.order="delivered"; if (patch.pay==="pending") patch.pay="paid"; }
      t.disabled=true;
      try { await saveStatus(id, patch); toast(a==="adm-paid"?"Payment confirmed":a==="adm-send"?"eSIM marked as sent. The customer can now install it from My orders.":"Order updated"); }
      catch(err){ toast("Couldn't save. Check your access and try again."); }
      t.disabled=false;
    } break;
    case "save-settings": {
      const data={bankName:$("#s-bankName").value.trim(), bankAccount:$("#s-bankAccount").value.trim(), bankHolder:$("#s-bankHolder").value.trim(), supportEmail:$("#s-supportEmail").value.trim(), kakaoId:$("#s-kakaoId").value.trim(), companyName:$("#s-companyName").value.trim(), ceo:$("#s-ceo").value.trim(), bizNo:$("#s-bizNo").value.trim(), mailOrderNo:$("#s-mailOrderNo").value.trim(), address:$("#s-address").value.trim(), phone:$("#s-phone").value.trim()};
      try { await (FB_MODE ? FDB.doc("settings/store").set(data) : S.db.doc("settings/store").set(data)); toast("Settings saved"); } catch(err){ toast("Couldn't save settings."); }
    } break;
    case "csv": exportCsv(); break;
    case "lookup": lookupOrder(); break;
    case "ad-login": { const em=$("#ad-em").value.trim(), pw=$("#ad-pw").value; t.disabled=true; try { await FAUTH.signInWithEmailAndPassword(em,pw); S.adErr=""; } catch(err){ S.adErr="Wrong email or password."; renderAdmin(); } } break;
    case "ad-logout": FAUTH.signOut(); break;
    case "open-locale": renderLocale(v==="cur"); $("#o-locale").hidden=false; break;
    case "set-cur": S.cur=v; try{localStorage.setItem("ts-cur",v)}catch(err){} $("#o-locale").hidden=true; rerenderAll(); toast(v==="KRW"?"Showing prices in KRW":window.t("Showing approximate prices in {0}", v)); break;
  }
});
document.addEventListener("keydown", e => {
  if (e.key==="Escape"){ closeAll(); if (S.home.q){ S.home.q=""; renderSugg(); } }
  if (e.key==="Enter" && (e.target.id==="ad-pw")){ document.querySelector('[data-a="ad-login"]')?.click(); }
  if (e.key==="Enter" && e.target.id==="h-q"){ e.preventDefault(); document.querySelector('[data-a="h-go"]').click(); }
  if (e.key==="Enter" && e.target.matches("tr[data-a='adm-open']")) { S.adm.open=e.target.dataset.v; renderOrderPanel(); }
});
document.addEventListener("input", e => {
  if (e.target.id==="dur-range"){ const L=curDays(); const n=snapDays(L,+e.target.value); const lo=+e.target.min, hi=+e.target.max; $("#dur-n").textContent=n; $("#dur-u").textContent=window.t(n>1?"days":"day"); e.target.style.setProperty("--p",(hi>lo?(+e.target.value-lo)/(hi-lo)*100:100)+"%"); return; }
  if (e.target.id==="hc-q"){ S.help.q=e.target.value; renderHelp(); return; }
  if (e.target.id==="h-q"){ S.home.q=e.target.value; renderSugg(); return; }
  if (e.target.id==="pk-q"){ S.picker.q=e.target.value; if (S.picker.q && S.picker.tab==="single" && !DEST.some(d=>!d.multi&&(d.name.toLowerCase().includes(S.picker.q.toLowerCase())||d.ko.includes(S.picker.q)))) {} renderPicker(); return; }
  if (e.target.id==="adm-q"){ S.adm.q=e.target.value; renderAdmin(); return; }
  const k = e.target.dataset?.f; if (!k) return;
  S.form[k] = e.target.type==="checkbox" ? e.target.checked : e.target.value;
  if (S.errors[k]) { delete S.errors[k]; }
  ls.set("wl-form", {...S.form, agree:false});
  if (e.target.dataset.rr !== undefined) renderCheckout();
});
document.addEventListener("change", e => {
  if (e.target.id==="dur-range"){ S.days=snapDays(curDays(),+e.target.value); const y=window.scrollY; renderShop(); window.scrollTo(0,y); return; }
  if (e.target.id==="cur-sel"){ S.cur=e.target.value; try{localStorage.setItem("ts-cur",S.cur)}catch(err){} rerenderAll(); return; }
  const k = e.target.dataset?.f; if (!k) return;
  S.form[k] = e.target.type==="checkbox" ? e.target.checked : e.target.value;
  ls.set("wl-form", {...S.form, agree:false});
  if (e.target.dataset.rr !== undefined || k==="agree") renderCheckout();
});

/* ============ boot ============ */
S.cart = S.cart.filter(it=>{ try { planOf(it); return it.sim!=="usim"; } catch(e){ return false; } }); ls.set("wl-cart", S.cart);
S.form.agree = false;
document.documentElement.lang = LANG==="zh" ? "zh-Hans" : LANG;
renderChrome();
TR.start();
{ const v = ADMIN_PAGE ? "admin" : parseHash(); go(VIEWS().includes(v) ? v : "home"); }
BOOTED = true;

function bootFirebase(){
  firebase.initializeApp(window.FIREBASE_CONFIG);
  FDB = firebase.firestore(); S.dbReady = true; S.user = null;
  const rerender = () => { if (S.view==="orders") renderOrders(); if (S.view==="admin") renderAdmin(); if (S.adm.open) renderOrderPanel(); if (S.view==="checkout" && S.coStage==="done") renderDone(); };
  FDB.doc("settings/store").onSnapshot(s => { S.settings = s.exists ? s.data() : {}; if (S.view==="help") renderHelp(); if (S.view==="home" && document.activeElement?.id!=="h-q") renderHome(); else if (!(S.view==="admin" && document.activeElement?.id?.startsWith("s-"))) rerender(); }, ()=>{});
  if (!ADMIN_PAGE){ watchMyOrders(); return; }
  FAUTH = firebase.auth(); let unsub = null;
  FAUTH.onAuthStateChanged(u => {
    S.fbUser = u; S.isAdmin = false; S.all = []; if (unsub){ unsub(); unsub=null; }
    if (u){ unsub = FDB.collection("orders").orderBy("createdAt","desc").limit(1000).onSnapshot(qs => { S.isAdmin = true; S.adErr=""; S.all = qs.docs.map(d=>d.data()); rerender(); }, err => { S.isAdmin=false; S.adErr="This account doesn't have admin access. Add its email to firestore.rules."; renderAdmin(); }); }
    renderAdmin();
  });
}

(async () => {
  if (FB_MODE){ bootFirebase(); return; }
  if (!window.claude?.use){ S.user=null; if (S.view==="admin") renderAdmin(); return; }
  const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  S.user = user; S.db = db;
  S.uid = user ? await user.id() : null;
  S.isAdmin = user ? await user.canEdit() : false;
  if (S.view==="admin") renderAdmin();
  if (!db || !S.uid){ if (S.view!=="shop") go(S.view); return; }
  S.dbReady = true;
  const rerender = () => { if (S.view==="orders") renderOrders(); if (S.view==="admin") renderAdmin(); if (S.adm.open) renderOrderPanel(); if (S.view==="checkout" && S.coStage==="done") renderDone(); };
  db.doc("orders/"+S.uid).onSnapshot(s => { S.mine = s.exists ? (s.data().orders||[]) : []; rerender(); }, ()=>{});
  db.doc("admin/status").onSnapshot(s => { S.status = s.exists ? (s.data().m||{}) : {}; rerender(); }, ()=>{});
  db.doc("settings/store").onSnapshot(s => { S.settings = s.exists ? s.data() : {}; if (S.view==="help") renderHelp(); if (S.view==="home" && document.activeElement?.id!=="h-q") renderHome(); if (S.view==="admin" && !document.activeElement?.id?.startsWith("s-")) renderAdmin(); else rerender(); }, ()=>{});
  if (S.isAdmin) db.collection("orders").onSnapshot(qs => { S.all = qs.docs.flatMap(d => d.data().orders||[]); rerender(); }, ()=>{});
  if (S.view==="checkout") renderCheckout();
  rerender();
})();
</script>
