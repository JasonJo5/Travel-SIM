<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Travel data eSIM for 80+ destinations. Unlimited, daily and data-pack plans with instant QR code delivery by email.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}</style>
<title>365 Travel SIM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 365 Travel SIM — Layout: landing page (hero search, destination cards, features, FAQ) + two-column plan page (plan picker left, info + device check right), fixed buy bar at the bottom; overlays for picker, cart, device check, admin detail */
:root{
  --c-daily:#e8590c; --s-daily:#fff1e7; --c-unl:#7c3aed; --s-unl:#f3edff; --c-tot:#0d9488; --s-tot:#e3f7f4;
  --bg:#ffffff; --panel:#f3f5f8; --surface:#ffffff; --ink:#191f28; --muted:#6b7684; --line:#e3e7ec;
  --accent:#1f5bd8; --accent-soft:#e8effd; --dark:#1b2333; --dark-ink:#ffffff; --hero:#f2f6ff; --hero-2:#dbe6ff;
  --orange:#e8590c; --orange-soft:#fff0e6; --teal:#0b8f83; --teal-soft:#e0f4f1; --sun:#c98a00; --sun-soft:#fff5d6;
  --ok:#12805c; --ok-soft:#e5f5ee; --warn:#a96400; --warn-soft:#fdf3e1; --bad:#d92d20; --bad-soft:#fdecea;
  --banner-a:#1f5bd8; --banner-b:#12a39c; --shadow:0 8px 30px rgba(20,30,45,.12);
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1318; --panel:#171c23; --surface:#1b2129; --ink:#e8ecf1; --muted:#98a2b0; --line:#2a323c;
  --c-daily:#ff8a4c; --s-daily:#2f1c10; --c-unl:#a78bfa; --s-unl:#231a3d; --c-tot:#2dd4bf; --s-tot:#0f2a27; --accent:#6f9dff; --accent-soft:#162447; --dark:#e8ecf1; --dark-ink:#11161c; --hero:#10151f; --hero-2:#172340;
  --orange:#ff8a4c; --orange-soft:#33200f; --teal:#3cc9b9; --teal-soft:#0f2b28; --sun:#f7c948; --sun-soft:#2e2610;
  --ok:#3dbe8b; --ok-soft:#12291f; --warn:#e3a53b; --warn-soft:#2b2210; --bad:#f2675c; --bad-soft:#2e1614;
  --banner-a:#1a47a8; --banner-b:#0e7d7a; --shadow:0 8px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1318; --panel:#171c23; --surface:#1b2129; --ink:#e8ecf1; --muted:#98a2b0; --line:#2a323c;
  --c-daily:#ff8a4c; --s-daily:#2f1c10; --c-unl:#a78bfa; --s-unl:#231a3d; --c-tot:#2dd4bf; --s-tot:#0f2a27; --accent:#6f9dff; --accent-soft:#162447; --dark:#e8ecf1; --dark-ink:#11161c; --hero:#10151f; --hero-2:#172340;
  --orange:#ff8a4c; --orange-soft:#33200f; --teal:#3cc9b9; --teal-soft:#0f2b28; --sun:#f7c948; --sun-soft:#2e2610;
  --ok:#3dbe8b; --ok-soft:#12291f; --warn:#e3a53b; --warn-soft:#2b2210; --bad:#f2675c; --bad-soft:#2e1614;
  --banner-a:#1a47a8; --banner-b:#0e7d7a; --shadow:0 8px 30px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;height:64px}
.top-in .brand{justify-self:start}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;text-decoration:none;color:var(--ink)}
.logo{display:inline-grid;place-items:center;height:30px;padding:0 7px;border-radius:9px;background:linear-gradient(135deg,var(--orange),#f59f00);color:#fff;font-weight:700;font-size:14px;letter-spacing:-.02em}
.btn-orange{background:#d9480f;color:#fff}
.btn-orange:hover{background:#c2410c}
.brand i{font-style:normal;font-size:11px;font-weight:600;letter-spacing:.08em;padding:2px 6px;border-radius:5px;background:var(--dark);color:var(--dark-ink)}
.nav{display:flex;gap:4px;justify-self:center;background:var(--panel);padding:4px;border-radius:999px}
.nav button{padding:8px 16px;border-radius:999px;color:var(--muted);font-weight:500;white-space:nowrap;transition:background .15s,color .15s}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{color:var(--ink);background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.top-actions{justify-self:end;display:flex;gap:6px;align-items:center}
.icon-btn{position:relative;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--ink)}
.icon-btn:hover{background:var(--panel)}
.icon-btn svg{width:22px;height:22px}
.badge{position:absolute;top:3px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center}
@media (max-width:900px){.nav{display:none}.top-in{grid-template-columns:1fr auto}}
@media (max-width:640px){.brand{font-size:16px}}

/* shop */
.page-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-block:24px 16px}
.page-title h1{font-size:26px;font-weight:700}
.shop{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:28px;align-items:start;padding-bottom:140px}
@media (max-width:920px){.shop{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}

.dest{background:var(--panel);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:16px}
.dest-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dest-name{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:700;min-width:0}
.dest-name small{display:block;font-size:13px;font-weight:500;color:var(--muted)}
.seg{display:inline-flex;background:var(--line);border-radius:999px;padding:4px}
.seg button{padding:7px 18px;border-radius:999px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pop-label{font-size:14px;color:var(--muted);margin-right:4px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;white-space:nowrap}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--dark);border-color:var(--dark);color:var(--dark-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:12px;font-weight:600;white-space:nowrap}
.btn-dark{background:var(--dark);color:var(--dark-ink)}
.btn-accent{background:var(--accent);color:#fff}
.btn-line{border:1px solid var(--line);background:var(--surface)}
.btn-sm{height:34px;padding:0 14px;border-radius:999px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.flag{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:20px;line-height:1;flex:none;overflow:hidden;background:var(--panel);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.flag img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.flag-lg{width:34px;height:34px;font-size:28px}
.flag-txt{background:var(--accent-soft);color:var(--accent);font-family:var(--f-mono);font-size:10px;font-weight:500}
.flag-lg.flag-txt{font-size:12px}
.flag-multi{background:var(--accent-soft);color:var(--accent)}
.flag-multi svg{width:62%;height:62%}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.tabs button{padding:14px 4px;font-size:18px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.opts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tab-note{font-size:13px;color:var(--muted);margin:0}

.rows{display:flex;flex-direction:column;gap:10px;max-height:560px;overflow-y:auto;padding:2px 6px 2px 2px;overscroll-behavior:contain}
.row{display:grid;grid-template-columns:22px 76px minmax(0,1fr) auto;align-items:center;gap:14px;padding:18px 20px;border:1px solid var(--line);border-radius:16px;background:var(--surface);text-align:left;width:100%}
.row:hover{border-color:var(--muted)}
.row[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft)}
.box{width:20px;height:20px;border:1.5px solid var(--muted);border-radius:5px;display:grid;place-items:center}
.row[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.box svg{width:14px;height:14px;color:#fff;opacity:0}
.row[aria-pressed="true"] .box svg{opacity:1}
.row-days{font-size:20px;font-weight:600;color:var(--accent)}
.row-main{min-width:0}
.row-main b{display:block;font-size:17px}
.row-main span{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.row-main svg{width:14px;height:14px;flex:none}
.row-price{font-size:19px;font-weight:600}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:2px}
@media (max-width:520px){.row{grid-template-columns:20px 54px minmax(0,1fr);row-gap:4px;padding:14px}.row-price{grid-column:3}.row-days{font-size:17px}}

.banner{position:relative;overflow:hidden;border-radius:20px;padding:32px 28px;min-height:190px;color:#fff;background:linear-gradient(115deg,var(--banner-a),var(--banner-b))}
.banner h2{font-size:26px;font-weight:700;max-width:13em;padding-right:120px;position:relative;z-index:1;box-sizing:content-box}
.banner p{margin:10px 0 0;opacity:.92;max-width:22em;position:relative;z-index:1}
.banner .txt{max-width:calc(100% - 130px)}
.banner .txt h2{padding-right:0;max-width:none}
.banner .orb{position:absolute;right:-60px;top:-70px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.12)}
.banner .globe{position:absolute;right:26px;bottom:-26px;width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.55),transparent 40%),radial-gradient(circle at 60% 60%,#3d9b4a 0 22%,transparent 23%),radial-gradient(circle at 30% 68%,#3d9b4a 0 14%,transparent 15%),radial-gradient(circle at 70% 25%,#3d9b4a 0 12%,transparent 13%),#6cc3f0}
.banner .plane{position:absolute;right:120px;top:22px;width:46px;height:46px;opacity:.95}
@media (max-width:520px){.banner .globe{width:84px;height:84px;right:10px}.banner .plane{display:none}.banner h2{font-size:22px}}

.acc{border:1px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden}
.acc details+details{border-top:1px solid var(--line)}
.acc summary{list-style:none;display:grid;grid-template-columns:32px minmax(0,1fr) 20px;gap:14px;align-items:center;padding:20px 22px;cursor:pointer}
.acc summary::-webkit-details-marker{display:none}
.acc summary b{display:block;font-size:16px}
.acc summary span{font-size:13px;color:var(--muted)}
.acc summary .ic{width:30px;height:30px;color:var(--accent)}
.acc summary .chev{width:20px;height:20px;transition:transform .2s}
.acc details[open] .chev{transform:rotate(180deg)}
.acc-body{padding:0 22px 20px 68px;font-size:14px;color:var(--muted)}
.acc-body ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.acc-body li b{color:var(--ink);font-weight:600}

.devcard{display:flex;align-items:center;gap:16px;padding:22px 24px;border-radius:18px;background:var(--panel);text-align:left;width:100%}
.devcard b{display:block;font-size:17px}
.devcard span{font-size:14px;color:var(--muted)}
.devcard .ph{margin-left:auto;width:44px;height:52px;color:var(--accent);flex:none}
.devcard.ok{background:var(--ok-soft)}
.devcard.ok b{color:var(--ok)}

.usimcard{padding:22px 24px;border-radius:18px;background:var(--panel)}
.usimcard b{display:block;font-size:17px;margin-bottom:6px}
.usimcard ul{margin:0;padding-left:18px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}

/* buy bar */
.buybar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.06);padding-bottom:env(safe-area-inset-bottom,0px)}
.buybar-in{display:flex;align-items:center;gap:16px;padding-block:14px;flex-wrap:wrap}
.buy-sel{min-width:0;flex:1 1 260px;display:flex;align-items:center;gap:12px}
.buy-sel b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.buy-sel>div{min-width:0}
.buy-sel span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;height:40px}
.qty button{width:36px;height:100%;font-size:18px}
.qty output{min-width:28px;text-align:center;font-weight:600}
.buy-total{font-size:20px;font-weight:700;min-width:110px;text-align:right}
.buy-actions{display:flex;gap:8px}
@media (max-width:640px){.buy-total{min-width:0;text-align:left}.buy-actions{flex:1 1 100%}.buy-actions .btn{flex:1}}

/* overlays */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(10,15,22,.45);display:flex;padding:16px}
.modal{margin:auto;width:min(720px,100%);max-height:calc(100% - 8px);background:var(--surface);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.modal-sm{width:min(520px,100%)}
.modal-head{display:flex;align-items:center;gap:12px;padding:22px 24px 12px}
.modal-head h2{font-size:22px;font-weight:700}
.x{margin-left:auto;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.x:hover{background:var(--panel)}
.x svg{width:20px;height:20px}
.modal-body{padding:8px 24px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.drawer{margin:0 0 0 auto;width:min(460px,100%);height:100%;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.drawer-foot{border-top:1px solid var(--line);padding:16px 24px;display:flex;flex-direction:column;gap:12px}

.search{display:flex;gap:10px}
.search label{flex:1;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:0 16px;height:56px;background:var(--surface);min-width:0}
.search label:focus-within{border-color:var(--accent)}
.search svg{width:20px;height:20px;color:var(--muted);flex:none}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:16px}
.ptabs{display:flex;gap:24px;border-bottom:1px solid var(--line)}
.ptabs button{padding:10px 0;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.ptabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:480px){.cgrid{grid-template-columns:minmax(0,1fr)}}
.citem{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;text-align:left;min-width:0}
.citem:hover{border-color:var(--muted)}
.citem[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.citem .nm{min-width:0;flex:1}
.citem .nm b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citem .nm span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citem .ck{width:18px;height:18px;color:var(--accent);flex:none}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}

/* device check */
.steps{display:flex;flex-wrap:wrap;gap:8px}
.mlist{display:flex;flex-direction:column;gap:8px}
.mlist button{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border:1px solid var(--line);border-radius:12px;text-align:left}
.mlist button:hover{border-color:var(--muted)}
.result{border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.result.ok{background:var(--ok-soft)}
.result.ok b{color:var(--ok)}
.result.bad{background:var(--bad-soft)}
.result.bad b{color:var(--bad)}
.result.info{background:var(--warn-soft)}
.result.info b{color:var(--warn)}
.result p{margin:0;font-size:14px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
.note{font-size:13px;color:var(--muted);margin:0}

/* cart */
.citems{display:flex;flex-direction:column;gap:12px}
.ci{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:start;padding:14px;border:1px solid var(--line);border-radius:14px}
.ci b{display:block}
.ci .meta{font-size:13px;color:var(--muted)}
.ci-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-esim{background:var(--teal-soft);color:var(--teal)}
.p-usim{background:var(--accent-soft);color:var(--accent)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:var(--accent-soft);color:var(--accent)}
.p-muted{background:var(--panel);color:var(--muted)}
.linkbtn{color:var(--muted);font-size:13px;text-decoration:underline}
.sumline{display:flex;justify-content:space-between;font-size:14px}
.sumline.big{font-size:18px;font-weight:700}

/* checkout */
.co{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;align-items:start;padding-block:8px 60px}
@media (max-width:920px){.co{grid-template-columns:minmax(0,1fr)}}
.card{border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:22px;display:flex;flex-direction:column;gap:16px}
.card h3{font-size:17px;font-weight:700}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:560px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:13px;font-weight:600}
.field input,.field select,.field textarea{height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--surface);width:100%}
.field textarea{height:auto;min-height:80px;padding:10px 12px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:0}
.field.err input,.field.err select,.field.err textarea{border-color:var(--bad)}
.ferr{font-size:12px;color:var(--bad)}
.radios{display:grid;gap:10px}
.radio{display:flex;gap:12px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.radio:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio input{accent-color:var(--accent);width:18px;height:18px;flex:none}
.radio b{display:block;font-size:15px}

function validate(){
  const e = {}, F = S.form;
  if (!F.name?.trim()) e.name = "Enter your name.";
  if (!/^\S+@\S+\.\S+$/.test(F.email||"")) e.email = "Enter a valid email address.";
  if ((F.phone||"").replace(/\D/g,"").length < 8) e.phone = "Enter a phone number we can reach you on.";
  if (!e.email && (F.email2||"").trim().toLowerCase()!==(F.email||"").trim().toLowerCase()) e.email2 = "The two emails don't match.";
  if (cartHas("esim") && !S.device) e._ = "Check eSIM support for your phone first.";
  if (!F.agree) e.agree = "Please confirm your phone supports eSIM and accept the terms.";
  return e;
}
function genCode(){ const d=new Date(); const p=n=>String(n).padStart(2,"0"); const r=Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[b%32]).join(""); return `TS${String(d.getFullYear()).slice(2)}${p(d.getMonth()+1)}${p(d.getDate())}-${r}`; }
async function submitOrder(payStatus, payRef){
  if (FB_MODE) return submitOrderFB();
  if (!S.db || !S.uid){ S.errors={_:"This view can't save orders. Open the store signed in to claude.ai with Contributor access or higher."}; renderCheckout(); return; }
  const F = S.form;
  const order = {
    id: genCode(), uid:S.uid, createdAt:new Date().toISOString(),
    customer:{name:F.name.trim(), email:F.email.trim(), phone:F.phone.trim()}, depart:F.depart,
    items:S.cart.map(it=>{const d=byId[it.dest],p=planOf(it);return {dest:it.dest, destName:d.name, sim:it.sim, kind:it.kind, opt:it.opt, days:it.days, title:p.title, sup:supRef(it), unit:p.price, qty:it.qty}}),
    device: cartHas("esim") ? S.device : null,
    delivery: {method:"email"},
    subtotal: cartTotal(), shipping: shipFee(), total: cartTotal()+shipFee(),
    payment:{method:F.pay, status:payStatus, ref:payRef||null}
  };
  S.submitting = true; renderCheckout();
  try {
    const ref = S.db.doc("orders/"+S.uid);
    const snap = await ref.get();
    const arr = snap.exists ? JSON.parse(JSON.stringify(snap.data().orders||[])) : [];
    arr.push(order);
    await ref.set({orders:arr});
    S.cart = []; ls.set("wl-cart", []); updateBadge();
    S.lastOrder = order; S.coStage = "done"; S.errors = {};
  } catch(err) {
    S.errors = {_: err?.code==="invalid_argument" ? "Your account can view this store but can't place orders. Ask the store owner for Contributor access." : err?.code==="quota_exceeded" ? "The order book is full. Please contact support." : "Couldn't place the order. Check your connection and try again."};
  }
  S.submitting = false; renderCheckout(); window.scrollTo(0,0);
}
function buildOrder(payStatus, payRef){
  const F = S.form;
  return {
    id: genCode(), createdAt:new Date().toISOString(),
    customer:{name:F.name.trim(), email:F.email.trim(), phone:F.phone.trim()}, depart:F.depart,
    items:S.cart.map(it=>{const d=byId[it.dest],p=planOf(it);return {dest:it.dest, destName:d.name, sim:it.sim, kind:it.kind, opt:String(it.opt), days:it.days, title:p.title, sup:supRef(it), unit:p.price, qty:it.qty}}),
    device: cartHas("esim") ? S.device : null,
    delivery: {method:"email"},
    subtotal: cartTotal(), shipping: shipFee(), total: cartTotal()+shipFee(),
    currencyShown: S.cur,
    payment:{method:F.pay, status:payStatus, ref:payRef||null},
    status:{order:"new", pay:payStatus}
  };
}
async function submitOrderFB(){
  const order = buildOrder("pending");

  try {

const FB_SUBS = {};
function watchMyOrders(){
  for (const {id} of ls.get("ts-orders", [])){
    if (FB_SUBS[id]) continue;
    FB_SUBS[id] = FDB.doc("orders/"+id).onSnapshot(snap => {
      S.mine = S.mine.filter(o=>o.id!==id);
      if (snap.exists) S.mine.push(snap.data());
      if (S.view==="orders") renderOrders();
    }, ()=>{});
  }
}

function adminRows(){

    const st = eff(o);

    if (!q) return true;

}

async function saveStatus(id, patch){
  if (FB_MODE){ const o=S.all.find(x=>x.id===id)||{}; await FDB.doc("orders/"+id).update({status:{...(o.status||{}), ...patch, updatedAt:new Date().toISOString()}}); return; }
  const entry = {...(S.status[id]||{}), ...patch, updatedAt:new Date().toISOString()};
  const ref = S.db.doc("admin/status");
  try { await ref.update({m:{[id]:entry}}); }
  catch(e){ if (e?.code==="invalid_argument"){ const snap=await ref.get(); if (!snap.exists) await ref.set({m:{[id]:entry}}); else throw e; } else throw e; }
}
async function exportCsv(){
  const dl = await window.claude?.use?.("downloads");
  const cols = ["Order","Created","Name","Email","Phone","Departure","Items","Total (KRW)","Payment method","Payment status","Order status","ICCID","SM-DP+","Activation code","Note"];
  const q = v => `"${String(v??"").replace(/"/g,'""')}"`;
  const lines = [cols.map(q).join(",")].concat(adminRows().map(o=>{const st=eff(o);return [o.id,o.createdAt,o.customer.name,o.customer.email,o.customer.phone,o.depart,o.items.map(i=>`${i.destName} ${i.title} x${i.qty}`).join("; "),o.total,o.payment.method,st.pay,st.order,st.iccid,st.smdp,st.acode,st.note].map(q).join(",")}));
  if (!dl){ try { const blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`orders-${new Date().toISOString().slice(0,10)}.csv`; document.body.appendChild(a); a.click(); a.remove(); } catch(e){ toast("Download isn't available here."); } return; }
  try { await dl.save({filename:`orders-${new Date().toISOString().slice(0,10)}.csv`, data:"﻿"+lines.join("\n")}); }

}

function go(v){
  if (S.view!==v){ const sec=$("#v-"+v); if (sec){ sec.classList.remove("enter"); void sec.offsetWidth; sec.classList.add("enter"); } }
  S.view = v;
  for (const id of ["home","shop","checkout","orders","admin","help"]) $("#v-"+id).hidden = id!==v;
  document.body.classList.toggle("is-admin", v==="admin");
  document.body.dataset.view = v;
  for (const id of ["home","orders","help"]){ const b=$("#t-"+id); if (b) b.classList.toggle("on", id===v); }
  for (const id of ["home","orders"]){ const b=$("#n-"+id); if (b) b.setAttribute("aria-current", id===v?"page":"false"); }
  { const hi=$("#n-help"), ii=$("#n-install"); if (hi) hi.setAttribute("aria-current", v==="help"&&S.help.tab!=="install"?"page":"false"); if (ii) ii.setAttribute("aria-current", v==="help"&&S.help.tab==="install"?"page":"false"); }
  if (v==="home") renderHome();
  if (v==="help") renderHelp();
  if (v==="shop") renderShop();
  if (v==="checkout") renderCheckout();
  if (v==="orders") renderOrders();
  if (v==="admin") renderAdmin();
  renderBuybar();
  try { history.replaceState(null,"","#"+v); } catch(e){}
  window.scrollTo(0,0);
}

function bootFirebase(){
  firebase.initializeApp(window.FIREBASE_CONFIG);
  FDB = firebase.firestore(); S.dbReady = true; S.user = null;
  const rerender = () => { if (S.view==="orders") renderOrders(); if (S.view==="admin") renderAdmin(); if (S.adm.open) renderOrderPanel(); if (S.view==="checkout" && S.coStage==="done") renderDone(); };
  FDB.doc("settings/store").onSnapshot(s => { S.settings = s.exists ? s.data() : {}; if (S.view==="help") renderHelp(); if (S.view==="home" && document.activeElement?.id!=="h-q") renderHome(); else if (!(S.view==="admin" && document.activeElement?.id?.startsWith("s-"))) rerender(); }, ()=>{});
  if (!ADMIN_PAGE){ watchMyOrders(); return; }
  FAUTH = firebase.auth(); let unsub = null;
  FAUTH.onAuthStateChanged(u => {
    S.fbUser = u; S.isAdmin = false; S.all = []; if (unsub){ unsub(); unsub=null; }
    if (u){ unsub = FDB.collection("orders").orderBy("createdAt","desc").limit(1000).onSnapshot(qs => { S.isAdmin = true; S.adErr=""; S.all = qs.docs.map(d=>d.data()); rerender(); }, err => { S.isAdmin=false; S.adErr="This account doesn't have admin access. Add its email to firestore.rules."; renderAdmin(); }); }
    renderAdmin();
  });
}

(async () => {
  if (FB_MODE){ bootFirebase(); return; }
  if (!window.claude?.use){ S.user=null; if (S.view==="admin") renderAdmin(); return; }
  const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  S.user = user; S.db = db;
  S.uid = user ? await user.id() : null;
  S.isAdmin = user ? await user.canEdit() : false;
  if (S.view==="admin") renderAdmin();
  if (!db || !S.uid){ if (S.view!=="shop") go(S.view); return; }
  S.dbReady = true;
  const rerender = () => { if (S.view==="orders") renderOrders(); if (S.view==="admin") renderAdmin(); if (S.adm.open) renderOrderPanel(); if (S.view==="checkout" && S.coStage==="done") renderDone(); };
  db.doc("orders/"+S.uid).onSnapshot(s => { S.mine = s.exists ? (s.data().orders||[]) : []; rerender(); }, ()=>{});
  db.doc("admin/status").onSnapshot(s => { S.status = s.exists ? (s.data().m||{}) : {}; rerender(); }, ()=>{});
  db.doc("settings/store").onSnapshot(s => { S.settings = s.exists ? s.data() : {}; if (S.view==="help") renderHelp(); if (S.view==="home" && document.activeElement?.id!=="h-q") renderHome(); if (S.view==="admin" && !document.activeElement?.id?.startsWith("s-")) renderAdmin(); else rerender(); }, ()=>{});
  if (S.isAdmin) db.collection("orders").onSnapshot(qs => { S.all = qs.docs.flatMap(d => d.data().orders||[]); rerender(); }, ()=>{});
  if (S.view==="checkout") renderCheckout();
  rerender();
})();
</script>

</body>
</html>
